<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Atem-Ball</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mansalva&display=swap" rel="stylesheet">
<!-- Beispiel für eine eigene Schriftart (kostenlos von Google Fonts):
     1. Diesen Link entkommentieren:
     <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300;500&display=swap" rel="stylesheet">
     2. Unten bei --schrift die Zeile einkommentieren.
-->
<style>
  /* =========================================================
     FARBEN & SCHRIFT – hier kannst du alles anpassen
     ========================================================= */
  :root {
    --ball-hell:   #FFFEB9;
    --ball-mitte:  #FFC758;
    --ball-warm:   #FA9920;
    --ball-aussen: #E87D35;
    --ball-dunkel: #B0521D;
    --ball-schein: rgba(250, 153, 32, 0.1);
    --text-farbe:  #e9f2ec;  /* Farbe von "breathe in" usw. */
    --schrift: 'Mansalva', cursive;
    /* Beispiel: --schrift: 'Comfortaa', system-ui, sans-serif; */
  }

  html, body { height: 100%; margin: 0; }
  body {
    background: #050812;
    font-family: var(--schrift);
    color: var(--text-farbe);
    overflow: hidden;
  }

  /* ============ HINTERGRUND: dunkler Sternenhimmel ============ */
  #all {
    position: fixed;
    inset: 0;
    z-index: -1;
    background:
      radial-gradient(circle at 8% 18%, #fff 0 1px, transparent 1.5px),
      radial-gradient(circle at 22% 72%, #dbe9ff 0 1px, transparent 1.5px),
      radial-gradient(circle at 37% 29%, #fff 0 1px, transparent 1.5px),
      radial-gradient(circle at 31% 88%, #dbe9ff 0 1px, transparent 1.5px),
      radial-gradient(circle at 67% 14%, #fff 0 1px, transparent 1.5px),
      radial-gradient(circle at 79% 61%, #dbe9ff 0 1px, transparent 1.5px),
      radial-gradient(circle at 93% 33%, #fff 0 1px, transparent 1.5px),
      radial-gradient(ellipse at 50% 50%, #080d1b 0%, #050812 55%, #03050b 100%);
  }

  #raumschiff {
    appearance: none;
    position: absolute;
    z-index: 0;
    left: 50%;
    bottom: max(8vh, 56px);
    width: clamp(90px, 16vw, 140px);
    padding: 0;
    aspect-ratio: 1366 / 768;
    background: url('raumschiff.png') center / contain no-repeat;
    mix-blend-mode: screen;
    opacity: 0.98;
    filter: brightness(1.4) sepia(0.24) saturate(1.08) hue-rotate(-7deg);
    border: 0;
    cursor: pointer;
    transform: translateX(-50%);
  }
  #raumschiff:focus-visible {
    outline: 2px solid var(--ball-hell);
    outline-offset: 5px;
  }
  #audio-controls {
    position: fixed;
    top: max(16px, env(safe-area-inset-top));
    right: max(16px, env(safe-area-inset-right));
    z-index: 4;
    display: flex;
    gap: 10px;
  }
  .audio-control {
    position: relative;
  }
  .audio-button {
    display: grid;
    width: 34px;
    height: 34px;
    place-items: center;
    padding: 0;
    border: 1px solid rgba(255, 254, 185, 0.28);
    border-radius: 50%;
    background: rgba(8, 13, 27, 0.82);
    color: var(--text-farbe);
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .audio-button[aria-pressed="true"] {
    color: var(--ball-hell);
    border-color: rgba(255, 254, 185, 0.65);
    box-shadow: 0 0 14px rgba(255, 224, 130, 0.16);
  }
  .audio-button svg {
    width: 17px;
    height: 17px;
    fill: none;
    stroke: currentColor;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-width: 1.7;
  }
  .audio-button:focus-visible {
    outline: 2px solid var(--ball-hell);
    outline-offset: 4px;
  }
  .volume-popover {
    position: absolute;
    top: calc(100% + 9px);
    right: 0;
    z-index: 5;
    width: 184px;
    padding: 10px 12px;
    border: 1px solid rgba(255, 254, 185, 0.28);
    border-radius: 10px;
    background: rgba(8, 13, 27, 0.96);
    color: var(--text-farbe);
    font: 12px/1.4 system-ui, sans-serif;
    box-shadow: 0 5px 18px rgba(0, 0, 0, 0.3);
  }
  .volume-popover[hidden] {
    display: none;
  }
  .volume-label {
    display: flex;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 6px;
  }
  .volume-slider {
    display: block;
    width: 100%;
    height: 18px;
    margin: 0;
    accent-color: var(--ball-hell);
    cursor: pointer;
  }
  .visually-hidden {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }
  /* ============ BALL-FLÄCHE ============ */
  #boden {
    position: relative;
    width: 100%; height: 100%;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 28px;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
  }

  #wort {
    position: relative;
    top: -10vh;
    min-height: 1.5em;
    font-size: 15px;
    letter-spacing: 0.18em;
    text-transform: lowercase;
    opacity: 0.9;
    text-align: center;
    font-weight: 300;
    -webkit-text-stroke: 0.15px #050812;
  }

  #zahl {
    position: relative;
    top: -10vh;
    min-height: 1.5em;
    font-size: 14px;
    text-align: center;
    opacity: 0.85;
    font-weight: 300;
    -webkit-text-stroke: 0.15px #050812;
  }

  #ball {
    position: relative;
    top: -10vh;
    z-index: 1;
    width: 90px; height: 90px; /* Startgröße, JS steuert die Größe */
    touch-action: none;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  #blob {
    position: absolute; inset: 0;
    background:
      radial-gradient(ellipse at 29% 23%, rgba(255, 254, 185, 0.92), rgba(255, 254, 185, 0.22) 13%, transparent 34%),
      radial-gradient(ellipse at 68% 70%, rgba(176, 82, 29, 0.48), transparent 43%),
      radial-gradient(ellipse at 70% 36%, rgba(232, 125, 53, 0.64), transparent 38%),
      radial-gradient(ellipse at 23% 70%, rgba(255, 199, 88, 0.4), transparent 42%),
      radial-gradient(
        ellipse at 37% 34%,
        var(--ball-hell) 0%,
        var(--ball-mitte) 22%,
        var(--ball-warm) 48%,
        var(--ball-aussen) 76%,
        var(--ball-dunkel) 100%
      );
    box-shadow:
      0 0 30px var(--ball-schein),
      inset 7px 6px 12px rgba(255, 254, 185, 0.28),
      inset -17px -19px 25px rgba(91, 34, 15, 0.5);
    border-radius: 47% 53% 49% 51% / 52% 46% 54% 48%;
    filter: hue-rotate(-24deg);
    transition: border-radius 8s cubic-bezier(0.45, 0, 0.55, 1), filter 0.7s ease;
    overflow: hidden;
  }
  #blob::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: inherit;
    background:
      conic-gradient(
        from 18deg at 50% 50%,
        rgba(255, 247, 130, 0.98),
        rgba(255, 196, 38, 0.98) 58deg,
        rgba(239, 77, 24, 0.88) 108deg,
        rgba(151, 48, 20, 0.82) 145deg,
        rgba(255, 212, 42, 0.98) 190deg,
        rgba(255, 234, 93, 0.98) 260deg,
        rgba(222, 77, 30, 0.82) 320deg,
        rgba(255, 247, 130, 0.98)
      ),
      radial-gradient(ellipse 54% 43% at 28% 34%, rgba(255, 239, 117, 0.99) 0%, rgba(255, 224, 80, 0.82) 45%, transparent 72%),
      radial-gradient(ellipse 55% 48% at 67% 54%, rgba(225, 62, 23, 0.82) 0%, rgba(225, 62, 23, 0.5) 44%, transparent 73%),
      radial-gradient(ellipse 58% 43% at 39% 72%, rgba(255, 211, 47, 0.99) 0%, rgba(255, 190, 34, 0.82) 45%, transparent 72%),
      radial-gradient(ellipse 48% 40% at 70% 24%, rgba(154, 43, 18, 0.75) 0%, rgba(154, 43, 18, 0.45) 45%, transparent 74%),
      radial-gradient(ellipse 38% 35% at 48% 48%, rgba(255, 238, 128, 0.99) 0%, rgba(255, 221, 73, 0.84) 45%, transparent 73%);
    background-size: 165% 155%;
    background-position: 0% 45%, 0% 0%, 100% 100%, 0% 100%, 100% 0%, 50% 50%;
    filter: blur(8px) saturate(1.3);
    mix-blend-mode: normal;
    opacity: 0.82;
    animation: lavalampe 26s ease-in-out infinite alternate;
  }
  #blob::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: inherit;
    background:
      repeating-linear-gradient(156deg, transparent 0 18px, rgba(255, 224, 130, 0.09) 19px, transparent 21px 34px),
      radial-gradient(ellipse at 30% 75%, rgba(136, 45, 19, 0.22), transparent 46%);
    mix-blend-mode: soft-light;
    opacity: 0.65;
    pointer-events: none;
  }
  @keyframes lavalampe {
    0% {
      background-position: 100% 30%, 0% 0%, 100% 100%, 0% 100%, 100% 0%, 50% 50%;
      filter: blur(8px) saturate(1.25);
    }
    38% {
      background-position: 25% 100%, 40% 25%, 65% 55%, 30% 65%, 85% 30%, 55% 40%;
      filter: blur(9px) saturate(1.38);
    }
    72% {
      background-position: 0% 25%, 100% 65%, 15% 15%, 85% 25%, 20% 80%, 45% 65%;
      filter: blur(7px) saturate(1.3);
    }
    100% {
      background-position: 100% 80%, 20% 100%, 0% 0%, 60% 100%, 35% 15%, 50% 55%;
      filter: blur(9px) saturate(1.42);
    }
  }
</style>
</head>
<body>
<div id="all"></div>
<div id="boden">
  <div id="wort" aria-live="polite">breathe in</div>
  <div id="zahl" aria-live="polite"></div>
  <div id="ball">
    <div id="blob"></div>
  </div>
  <button id="raumschiff" type="button" aria-label="Atemübung pausieren" title="Atemübung pausieren"></button>
</div>
<div id="audio-controls" aria-label="Audio">
  <div class="audio-control">
    <button class="audio-button" id="music-toggle" type="button" aria-label="Faith’s Hymn abspielen" aria-pressed="false" aria-haspopup="true" aria-expanded="false" title="Faith’s Hymn abspielen (Rechtsklick: Lautstärke)">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M4 13v-2a8 8 0 0 1 16 0v2"/>
        <rect x="3" y="12" width="4" height="7" rx="2"/>
        <rect x="17" y="12" width="4" height="7" rx="2"/>
      </svg>
    </button>
    <div class="volume-popover" id="music-volume-panel" hidden>
      <label class="volume-label" for="music-volume">
        <span>Faith’s Hymn</span><output id="music-volume-value" for="music-volume">50%</output>
      </label>
      <input class="volume-slider" id="music-volume" type="range" min="0" max="100" value="50" aria-label="Lautstärke Faith’s Hymn">
    </div>
  </div>
  <div class="audio-control">
    <button class="audio-button" id="river-toggle" type="button" aria-label="Flussaufnahme abspielen" aria-pressed="false" aria-haspopup="true" aria-expanded="false" title="Flussaufnahme abspielen (Rechtsklick: Lautstärke)">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 3.2C9.3 7.1 6.5 10.2 6.5 14a5.5 5.5 0 0 0 11 0c0-3.8-2.8-6.9-5.5-10.8Z"/>
        <path d="M9.5 15.5c.3 1.1 1.1 1.7 2.3 1.8"/>
      </svg>
    </button>
    <div class="volume-popover" id="river-volume-panel" hidden>
      <label class="volume-label" for="river-volume">
        <span>Flussaufnahme</span><output id="river-volume-value" for="river-volume">50%</output>
      </label>
      <input class="volume-slider" id="river-volume" type="range" min="0" max="100" value="50" aria-label="Lautstärke Flussaufnahme">
    </div>
  </div>
</div>
<audio id="faiths-hymn" src="Faith%E2%80%99s%20Hymn.mp3" loop preload="none"></audio>
<audio id="forest-river" src="forest-river-15min.mp3" loop preload="none"></audio>
<span id="audio-status" class="visually-hidden" aria-live="polite"></span>
<script>
  const ball   = document.getElementById('ball');
  const wort   = document.getElementById('wort');
  const zahlEl = document.getElementById('zahl');
  const blob   = document.getElementById('blob');
  const schiff = document.getElementById('raumschiff');
  const hymn = document.getElementById('faiths-hymn');
  const forestRiver = document.getElementById('forest-river');
  const musicToggle = document.getElementById('music-toggle');
  const riverToggle = document.getElementById('river-toggle');
  const audioStatus = document.getElementById('audio-status');
  const volumeControls = [
    {
      button: musicToggle,
      panel: document.getElementById('music-volume-panel'),
      slider: document.getElementById('music-volume'),
      output: document.getElementById('music-volume-value'),
      audio: hymn
    },
    {
      button: riverToggle,
      panel: document.getElementById('river-volume-panel'),
      slider: document.getElementById('river-volume'),
      output: document.getElementById('river-volume-value'),
      audio: forestRiver
    }
  ];

  /* =========================================================
     EINSTELLUNGEN – hier kannst du das Tempo anpassen
     ========================================================= */
  const MIN = 90;     // kleinster Ball-Durchmesser (Pixel)
  // Größter Durchmesser: höchstens 330 Pixel, auf kleinen
  // Bildschirmen passend zur Fenstergröße:
  let MAX = Math.max(MIN, Math.min(330, Math.min(window.innerWidth, window.innerHeight) * 0.55));
  const MAX_ZAHL = 10;
  const SEK_PRO_ZAHL = 1;
  const INAKTIVITAETS_RESET_MS = 30_000;

  function closeVolumePanels() {
    for (const control of volumeControls) {
      control.panel.hidden = true;
      control.button.setAttribute('aria-expanded', 'false');
    }
  }
  for (const control of volumeControls) {
    const initialVolume = Number(control.slider.value);
    control.audio.volume = initialVolume / 100;
    control.output.value = `${initialVolume}%`;
    control.slider.addEventListener('input', () => {
      const volume = Number(control.slider.value);
      control.audio.volume = volume / 100;
      control.output.value = `${volume}%`;
    });
    control.button.addEventListener('contextmenu', (event) => {
      event.preventDefault();
      const shouldOpen = control.panel.hidden;
      closeVolumePanels();
      control.panel.hidden = !shouldOpen;
      control.button.setAttribute('aria-expanded', String(shouldOpen));
      if (shouldOpen) control.slider.focus();
    });
    control.button.addEventListener('click', closeVolumePanels);
  }
  document.addEventListener('pointerdown', (event) => {
    if (!(event.target instanceof Element) || !event.target.closest('.audio-control')) {
      closeVolumePanels();
    }
  });
  document.addEventListener('keydown', (event) => {
    if (event.key === 'Escape') closeVolumePanels();
  });

  let groesse = MIN;      // aktuelle Ballgröße
  let richtung = 1;       // 1 = wachsen (breathe in), -1 = schrumpfen (breathe out)
  let phase = 'start';    // 'start' | 'ein' | 'aus' | 'halten'
  let startGroesse = MIN; // Größe beim Beginn der aktuellen Phase
  let phasenStart = 0;    // Zeitpunkt, an der die Phase begann
  let haltenStart = 0;    // Zeitpunkt, an dem die Haltephase begann
  let aktivePointerId = null; // der eine Finger, der gerade zählt
  let pausiert = false;
  let inaktivitaetsTimer = 0;
  async function audioUmschalten(audio, button, trackName, playingMessage, stoppedMessage, errorMessage) {
    if (!audio.paused) {
      audio.pause();
      button.setAttribute('aria-pressed', 'false');
      button.setAttribute('aria-label', `${trackName} abspielen`);
      button.title = `${trackName} abspielen (Rechtsklick: Lautstärke)`;
      audioStatus.textContent = stoppedMessage;
      return;
    }
    try {
      await audio.play();
      button.setAttribute('aria-pressed', 'true');
      button.setAttribute('aria-label', `${trackName} stoppen`);
      button.title = `${trackName} stoppen (Rechtsklick: Lautstärke)`;
      audioStatus.textContent = playingMessage;
    } catch (error) {
      button.setAttribute('aria-pressed', 'false');
      button.setAttribute('aria-label', `${trackName} abspielen`);
      button.title = `${trackName} abspielen (Rechtsklick: Lautstärke)`;
      if (error.name === 'NotAllowedError') {
        audioStatus.textContent = 'Der Browser hat die Wiedergabe blockiert. Klicke erneut auf das Audio-Icon.';
      } else {
        audioStatus.textContent = errorMessage;
        console.error(`${trackName} konnte nicht abgespielt werden.`, error);
      }
    }
  }
  musicToggle.addEventListener('click', () => {
    void audioUmschalten(
      hymn,
      musicToggle,
      'Faith’s Hymn',
      'Faith’s Hymn wird abgespielt.',
      'Faith’s Hymn wurde angehalten.',
      'Faith’s Hymn konnte nicht gestartet werden. Prüfe, ob die MP3-Datei im Projektordner liegt, und versuche es erneut.'
    );
  });
  riverToggle.addEventListener('click', () => {
    void audioUmschalten(
      forestRiver,
      riverToggle,
      'Flussaufnahme',
      'Die Flussaufnahme wird abgespielt.',
      'Die Flussaufnahme wurde angehalten.',
      'Die Flussaufnahme konnte nicht gestartet werden. Prüfe, ob die MP3-Datei im Projektordner liegt, und versuche es erneut.'
    );
  });

  function formNaechsteForm() {
    const werte = Array.from({ length: 8 }, () => Math.round(47 + Math.random() * 6));
    const dauer = 18 + Math.random() * 7;
    blob.style.transitionDuration = `${dauer}s`;
    blob.style.borderRadius =
      `${werte[0]}% ${werte[1]}% ${werte[2]}% ${werte[3]}% / ` +
      `${werte[4]}% ${werte[5]}% ${werte[6]}% ${werte[7]}%`;
    window.setTimeout(formNaechsteForm, dauer * 1000);
  }
  formNaechsteForm();

  function zurueckZumStart() {
    aktivePointerId = null;
    phase = 'start';
    richtung = 1;
    groesse = MIN;
    zeigeWartemodus();
  }
  function planeInaktivitaetsReset() {
    window.clearTimeout(inaktivitaetsTimer);
    inaktivitaetsTimer = window.setTimeout(zurueckZumStart, INAKTIVITAETS_RESET_MS);
  }
  document.addEventListener('pointerdown', () => window.clearTimeout(inaktivitaetsTimer));
  document.addEventListener('pointerup', planeInaktivitaetsReset);
  document.addEventListener('pointercancel', planeInaktivitaetsReset);
  planeInaktivitaetsReset();

  function zeigeWartemodus() {
    if (phase === 'start') {
      wort.textContent = 'breathe in';
      zahlEl.textContent = '';
    }
  }
  function pauseUmschalten() {
    pausiert = !pausiert;
    if (pausiert) {
      const pointerId = aktivePointerId;
      aktivePointerId = null;
      phase = 'start';
      richtung = 1;
      groesse = MIN;
      if (pointerId !== null && ball.hasPointerCapture(pointerId)) {
        ball.releasePointerCapture(pointerId);
      }
    }
    zeigeWartemodus();
    schiff.setAttribute('aria-label', pausiert ? 'Atemübung fortsetzen' : 'Atemübung pausieren');
    schiff.title = pausiert ? 'Atemübung fortsetzen' : 'Atemübung pausieren';
  }
  schiff.addEventListener('click', pauseUmschalten);

  /* ---------- Berührung ---------- */
  function pressStart(e) {
    if (pausiert || aktivePointerId !== null) return; // zweiter Finger? ignorieren
    aktivePointerId = e.pointerId;
    ball.setPointerCapture(e.pointerId);
    phase = richtung === 1 ? 'ein' : 'aus';
    startGroesse = groesse;             // ab der aktuellen Größe …
    phasenStart = performance.now();   // … über die volle Zähldauer
    wort.textContent = phase === 'ein' ? 'breathe in' : 'breathe out';
    zahlEl.textContent = '1';
  }
  function pressEnde(e) {
    // Nur beenden, wenn es wirklich dieser Finger war …
    if (e && e.pointerId !== undefined && e.pointerId !== aktivePointerId) return;
    // … und nur, wenn gerade eine Atemphase lief (nicht doppelt ausführen)
    if (phase !== 'ein' && phase !== 'aus') return;
    aktivePointerId = null;
    richtung = -richtung; // beim nächsten Druck in die andere Richtung
    phase = 'halten';
    haltenStart = performance.now();
    wort.textContent = 'hold';
    zahlEl.textContent = '1';
  }
  ball.addEventListener('pointerdown',   pressStart);
  ball.addEventListener('pointerup',     pressEnde);
  ball.addEventListener('pointercancel', pressEnde);      // z.B. eingehender Anruf
  ball.addEventListener('lostpointercapture', pressEnde); // Berührung ging verloren
  window.addEventListener('blur',       () => pressEnde()); // App in Hintergrund
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) pressEnde();
  });
  // Maximalgröße neu berechnen, wenn das Fenster gedreht wird
  window.addEventListener('resize', () => {
    MAX = Math.max(MIN, Math.min(330, Math.min(window.innerWidth, window.innerHeight) * 0.55));
    groesse = Math.min(MAX, Math.max(MIN, groesse));
  });
  zeigeWartemodus();

  /* ---------- Animations-Schleife ---------- */
  function schleife(zeit) {
    if (phase === 'ein' || phase === 'aus') {
      // Anteil der verstrichenen Zeit (0 bis 1), sanft geglättet:
      const ziel    = phase === 'ein' ? MAX : MIN;
      const vergangen = (zeit - phasenStart) / 1000;
      let anteil   = Math.min(1, vergangen / (MAX_ZAHL * SEK_PRO_ZAHL));
      anteil = anteil * anteil * (3 - 2 * anteil); // weiches Starten/Enden
      groesse = startGroesse + (ziel - startGroesse) * anteil;
      zahlEl.textContent = zaehlwert(vergangen);
    } else if (phase === 'halten') {
      const gehalten = (zeit - haltenStart) / 1000;
      zahlEl.textContent = zaehlwert(gehalten);
    }
    groesse = Math.min(MAX, Math.max(MIN, groesse));
    const groessenAnteil = (groesse - MIN) / Math.max(1, MAX - MIN);
    const farbShift = -24 * (1 - groessenAnteil);

    ball.style.width  = groesse + 'px';
    ball.style.height = groesse + 'px';
    blob.style.filter = `hue-rotate(${farbShift}deg)`;
    requestAnimationFrame(schleife); // nächstes Bild anfordern
  }
  function zaehlwert(sekunden) {
    return Math.min(MAX_ZAHL, Math.floor(Math.max(0, sekunden) / SEK_PRO_ZAHL) + 1);
  }
  requestAnimationFrame(schleife);
</script>
</body>
</html>
